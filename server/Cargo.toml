# Folio's server: the API and the web app (web/, built by trunk) served by one binary.
# A Cargo workspace of its own, like web/.
[workspace]
resolver = "2"
members = ["crates/migrate"]

[package]
name = "folio"
description = "Folio's server: the API and the web app, one binary."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Krifmaz/folio"
publish = false

# the library is `server` in every app, so the Rust files need no app name (the binary keeps the package name)
[lib]
name = "server"
path = "src/lib.rs"

# The kit, pinned to one release tag. To update: read the kit's CHANGELOG.md, bump the tag here and in
# web/Cargo.toml, run the tests.
[dependencies]
kit-server-core = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2", features = ["sqlite"] }
kit-server-health = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2" }
kit-server-changelog = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2" }
kit-server-notices = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2" }
kit-server-bugreports = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2" }
kit-server-diagnostics = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2" }
kit-server-settings = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2" }
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
cookie = "0.18"
tokio = { version = "1", features = ["full"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.17"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
unicode-normalization = "0.1"
# Track A (player and reader): sending library files whole or in parts
tower = { version = "0.5", features = ["util"] }
# Track D (migration): reading the other apps' databases
folio-migrate = { path = "crates/migrate" }
# Track C (compatibility): KOReader's MD5s (EPUBs are read with core's zip above)
md-5 = "0.10"
# Core (the Audiobookshelf port): its socket.io
socketioxide = { version = "0.18", features = ["state"] }
# Core (the Audiobookshelf port): its HTML cleaning (sanitize-html), form bodies and cookie dates
ammonia = "4"
serde_urlencoded = "0.7"
# Core (the Audiobookshelf port): its mail sender (nodemailer) and the attachments' types
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mime_guess = "2"
httpdate = "1"
# P6 backups: a restore copies the backup's tables on a connection of its own (the kit's own rusqlite)
rusqlite = { version = "0.39", features = ["bundled"] }
# Track C (the library side): the scanner's file and tag patterns
regex = "1"
# Track D (the Readarr port): .NET patterns that look around (Readarr's name cleaning and naming tokens)
fancy-regex = "0.14"

[build-dependencies]
kit-server-settings = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2", default-features = false, features = ["toml"] }
kit-server-changelog = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.2", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Track D (migration): the tests make other apps' databases
rusqlite = { version = "0.39", features = ["bundled"] }

[lints.rust]
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
