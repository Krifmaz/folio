# The settings table: every server setting with its environment variable and default, and for the ones on the
# Settings pages, the words and the layout of their field (the kit's
# crates/kit-server-settings README lists every option). build.rs turns this file into settings_gen.rs through kit-server-settings: the `Keys` names,
# the `TABLE` of definitions the store reads, and `SCHEMA`, which GET /api/settings/schema answers with.
#
# [sections.<id>]  a page under Settings, in nav order: title.
# [groups.<id>]    a card on a page, in page order: section, title, desc.
# [keys.<name>]    one setting: env (the environment variable that sets it and locks it in the UI), default (its
#                  TOML type is the setting's type), secret, group (the card that shows it), label, help, type,
#                  options, when, unit, min, max, step, full, advanced.

[sections.general]
title = "General"

[groups.general]
section = "general"
title = "General"
desc = "Your server's name and how long people stay signed in."

[keys.app_name]
env = "APP_NAME"
default = "Folio"
group = "general"
label = "App name"
type = "text"

[keys.session_days]
env = "APP_SESSION_DAYS"
default = 30
group = "general"
label = "Stay signed in for (days)"
type = "number"
unit = "days"
min = 1

[keys.api_key]
env = "APP_API_KEY"
default = ""
secret = true
help = "The server's API key (`x-api-key`): signs in as the owner. Empty: no API key."

[sections.downloads]
title = "Downloads"

[groups.lantern]
section = "downloads"
title = "Lantern"
desc = "Folio downloads only through Lantern: its address and API key are all it needs."

[keys.lantern_url]
env = "APP_LANTERN_URL"
default = ""
group = "lantern"
label = "Lantern address"
help = "For example http://lantern:8080"
type = "url"

[keys.lantern_api_key]
env = "APP_LANTERN_API_KEY"
default = ""
secret = true
group = "lantern"
label = "Lantern API key"
help = "From Lantern → Settings → General."
type = "password"

[keys.public_url]
env = "APP_PUBLIC_URL"
default = ""
group = "lantern"
label = "Folio's own address"
help = "Where Lantern can reach Folio (for example http://folio:8080), so it says at once when a download is done. Empty: Folio asks Lantern every minute."
type = "url"

[groups.verify]
section = "downloads"
title = "Checking what arrives"
desc = "Every download is checked against the edition you asked for before it is filed. Anything Folio isn't sure of waits under Review."

[keys.verify_min_confidence]
env = "APP_VERIFY_MIN_CONFIDENCE"
default = 85
group = "verify"
label = "Sure enough to file it (%)"
help = "How sure Folio must be that a download is the right edition to file it without asking (1 to 100)."
type = "number"
min = 1
max = 100

[keys.ffprobe]
env = "APP_FFPROBE"
default = "ffprobe"
group = "verify"
label = "ffprobe program"
help = "Reads audiobooks' length, chapters and tags. Folio's image has it; elsewhere, its path."

[groups.library]
section = "downloads"
title = "Library"
desc = "Where finished books are filed: Author/Series/NN - Title (Year)/. Lantern's download folder must be on the same disk, so files are hardlinked, not copied."

[keys.library_dir]
env = "APP_LIBRARY_DIR"
default = "/library"
group = "library"
label = "Library folder"
help = "The folder Folio files books into, for example /library."

[groups.searching]
section = "downloads"
title = "Searching"
desc = "How wanted books are searched for and when a result is good enough to grab."

[keys.search_every_hours]
env = "APP_SEARCH_EVERY_HOURS"
default = 6
group = "searching"
label = "Search the wanted list every"
help = "0 turns automatic searches off; Search now still works."
type = "number"
unit = "hours"
min = 0
max = 168

[keys.min_score]
env = "APP_MIN_SCORE"
default = 70
group = "searching"
label = "Grab results that score at least"
help = "Each result scores up to 100 on its title, author, narrator, ASIN or ISBN, file format, language, size and seeders."
type = "number"
min = 1
max = 100

[sections.metadata]
title = "Metadata"

[groups.audiobooks]
section = "metadata"
title = "Audiobooks"
desc = "Audiobook editions come from Audnexus, by their Audible ASIN."

[keys.audible_region]
env = "APP_AUDIBLE_REGION"
default = "us"
group = "audiobooks"
label = "Audible store"
help = "The Audible store whose ASINs you add. Each store has its own ASINs and narrators."
type = "select"
options = [["us", "United States"], ["uk", "United Kingdom"], ["ca", "Canada"], ["au", "Australia"], ["de", "Germany"], ["fr", "France"], ["es", "Spain"], ["it", "Italy"], ["in", "India"], ["jp", "Japan"]]

[keys.audnexus_url]
env = "APP_AUDNEXUS_URL"
default = "https://api.audnex.us"
group = "audiobooks"
label = "Audnexus address"
type = "url"
advanced = true

[keys.audible_url]
env = "APP_AUDIBLE_URL"
default = ""
group = "audiobooks"
label = "Audible catalogue address"
help = "Where followed authors' and series' new audiobooks are listed. Empty: the store's own (api.audible.com and so on)."
type = "url"
advanced = true

[groups.following]
section = "metadata"
title = "Following"
desc = "How often followed authors and series are checked for new books."

[keys.follow_check_hours]
env = "APP_FOLLOW_CHECK_HOURS"
default = 12
group = "following"
label = "Check every"
help = "New books of followed authors and series are added to the wanted list. 0 turns the check off."
type = "number"
unit = "hours"
min = 0
max = 168

[groups.ebooks]
section = "metadata"
title = "Ebooks"
desc = "Ebook editions come from Open Library, Google Books and Hardcover, by their ISBN. Each fills what the others miss."

[keys.hardcover_token]
env = "APP_HARDCOVER_TOKEN"
default = ""
secret = true
group = "ebooks"
label = "Hardcover API token"
help = "Optional. From hardcover.app → Settings → API. Without it, Hardcover is not asked."
type = "password"

[keys.google_books_key]
env = "APP_GOOGLE_BOOKS_KEY"
default = ""
secret = true
group = "ebooks"
label = "Google Books API key"
help = "Optional. Google Books answers without a key, but allows more lookups with one."
type = "password"

[keys.openlibrary_url]
env = "APP_OPENLIBRARY_URL"
default = "https://openlibrary.org"
group = "ebooks"
label = "Open Library address"
type = "url"
advanced = true

[keys.googlebooks_url]
env = "APP_GOOGLEBOOKS_URL"
default = "https://www.googleapis.com/books/v1"
group = "ebooks"
label = "Google Books address"
type = "url"
advanced = true

[keys.hardcover_url]
env = "APP_HARDCOVER_URL"
default = "https://api.hardcover.app/v1/graphql"
group = "ebooks"
label = "Hardcover address"
type = "url"
advanced = true
