# Reads what another app knows (Audiobookshelf, Calibre, Calibre-Web, Readarr, LazyLibrarian, Listenarr) into one
# plan Folio can show as a dry run and then bring in. It only reads: the source files are never changed.
[package]
name = "folio-migrate"
description = "Reads Audiobookshelf, Calibre, Calibre-Web, Readarr, LazyLibrarian and Listenarr into a migration plan, without changing them."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Krifmaz/folio"
publish = false

[lib]
name = "migrate"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
