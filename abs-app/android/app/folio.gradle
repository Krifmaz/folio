// Folio's changes to the Audiobookshelf app's build, kept out of build.gradle so upstream merges stay clean
// (build.gradle only applies this file). See abs-app/FOLIO.md.

// The version from the release workflow (the kit's kit-android.yml): -PappVersionName=… -PappVersionCode=…;
// a local build keeps the upstream version.
def folioVersionName = project.findProperty("appVersionName")
def folioVersionCode = project.findProperty("appVersionCode")

// Release signing from the environment (CI decodes ANDROID_KEYSTORE_BASE64 to a file and sets the path). Without a
// keystore the release build is signed with the debug key, so it still installs.
def folioKeystore = System.getenv("ANDROID_KEYSTORE_PATH")
def folioHasKey = folioKeystore != null && !folioKeystore.isEmpty() && file(folioKeystore).isFile()

android {
  defaultConfig {
    if (folioVersionName != null) versionName folioVersionName.toString()
    if (folioVersionCode != null) versionCode folioVersionCode.toString().toInteger()
  }
  signingConfigs {
    folioRelease {
      if (folioHasKey) {
        storeFile file(folioKeystore)
        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias System.getenv("ANDROID_KEY_ALIAS")
        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
      }
    }
  }
  buildTypes {
    release {
      signingConfig folioHasKey ? signingConfigs.folioRelease : signingConfigs.debug
    }
  }
}
