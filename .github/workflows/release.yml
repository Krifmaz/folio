name: release

# Every push to main makes a normal GitHub release vMAJOR.MINOR.PATCH (never a pre-release) through the kit's
# shared workflows: PATCH by default, MINOR or MAJOR when the merged pull request added docs/releases/<version>.md
# (also the release notes and What's new). It ships the server and web app as Linux tarballs, the Docker image
# ghcr.io/krifmaz/folio:<version> and :latest, and SHA256SUMS.
# Actions → release → Run workflow with "apps" ticked also builds the signed Android APK (secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); a release without it keeps the previous APK.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number to bump for the next version"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: "Or type the version to release (MAJOR.MINOR.PATCH); overrides bump"
        type: string
        default: ""
      apps:
        description: "Also build the apps (the Android APK)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@v0.2.2
    with:
      rust-dirs: server
      wasm-dirs: web

  prepare:
    needs: test
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.2.2
    with:
      stage: prepare
      app-name: Folio
      bump: ${{ inputs.bump || 'auto' }}
      version: ${{ inputs.version || '' }}
      web-dir: web
      server-dir: server
      server-bin: folio
      # 0.0.x until a requested audiobook and ebook arrive verified end to end; that PR adds docs/releases/0.1.0.md
      first-version: "0.0.1"

  docker:
    needs: prepare
    uses: Krifmaz/kit/.github/workflows/kit-docker.yml@v0.2.2
    with:
      image: folio
      version: ${{ needs.prepare.outputs.version }}
      build-args: |
        APP_VERSION=${{ needs.prepare.outputs.version }}

  android:
    needs: prepare
    if: inputs.apps
    uses: Krifmaz/kit/.github/workflows/kit-android.yml@v0.2.2
    with:
      app-name: Folio
      version: ${{ needs.prepare.outputs.version }}
      code: ${{ needs.prepare.outputs.code }}
      project-dir: android
      baseline-profile: true
    secrets:
      android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    needs: [prepare, docker, android]
    if: always() && needs.prepare.result == 'success' && needs.docker.result == 'success'
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.2.2
    with:
      stage: publish
      app-name: Folio
      version: ${{ needs.prepare.outputs.version }}
      apps-result: ${{ needs.android.result }}
      app-files: "Folio-android-*.apk"
      carry-over: "Folio-android-*.apk"
