name: parity-record

# Records how the pinned original answers, so Folio's parity tests can compare against it (docs/PARITY.md).
# Runs the original's own image (the version in UPSTREAM.lock) on generated test media, replays
# server/tests/parity/abs/requests.json against it, and uploads the answers and the database schema as the
# `abs-fixtures` artifact. On a pull request it also pushes them to the side branch `parity/<branch>`; the fixtures
# themselves are committed by a person or a track.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/tests/parity/abs/**
      - .github/workflows/parity-record.yml

permissions:
  contents: read

jobs:
  abs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Make test media
        run: server/tests/parity/abs/make_media.sh "$RUNNER_TEMP/media"
      - name: Start the original
        run: |
          version="$(sed -n '/^\[abs-server\]/,/^\[/s/^ref = "v\(.*\)"/\1/p' UPSTREAM.lock)"
          echo "Audiobookshelf $version"
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/metadata"
          docker run -d --name abs -p 13378:80 -e TZ=UTC \
            -v "$RUNNER_TEMP/media:/media:ro" \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/metadata:/metadata" \
            "ghcr.io/advplyr/audiobookshelf:$version"
      - name: Record
        run: python3 -I server/tests/parity/abs/record.py http://127.0.0.1:13378 "$RUNNER_TEMP/out" "$RUNNER_TEMP/config/absdatabase.sqlite"
      - name: Print the recording
        # Also printed to the log (base64 of a .tar.gz between markers), for readers that can't reach artifacts.
        run: |
          echo "::group::abs-fixtures.tar.gz (base64)"
          echo "FOLIO-FIXTURES-BEGIN"
          tar czf - -C "$RUNNER_TEMP/out" . | base64 -w0
          echo
          echo "FOLIO-FIXTURES-END"
          echo "::endgroup::"
      - name: Server log on failure
        if: failure()
        run: docker logs abs | tail -200
      - uses: actions/upload-artifact@v4
        with:
          name: abs-fixtures
          path: ${{ runner.temp }}/out
      - name: Push the recording to parity/<branch>
        # For sessions that can reach git but not artifacts or logs: `git fetch origin parity/<branch>`. Only for
        # pull requests from this repository; the branch holds nothing but the recording, replaced on every run.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: parity/${{ github.head_ref }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b record .
          git -c user.name="parity-record" -c user.email="parity-record@users.noreply.github.com" add -A
          git -c user.name="parity-record" -c user.email="parity-record@users.noreply.github.com" \
            commit -qm "Recording of ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
